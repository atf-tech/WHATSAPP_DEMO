<style>
  .chat-header {
    background: #ededed;
    padding: 10px;
    font-weight: bold;
  }

  .messages {
    height: 65vh;
    overflow-y: auto;
    padding: 10px;
    background: #e5ddd5;
  }

  .msg {
    margin-bottom: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    max-width: 70%;
    clear: both;
  }

  .msg.in {
    background: white;
    float: left;
  }

  .msg.out {
    background: #dcf8c6;
    float: right;
  }

  .input-box {
    background: #f0f0f0;
    padding: 10px;
    display: flex;
    gap: 6px;
  }

  .input-box input,
  .input-box select {
    padding: 8px;
    border: none;
  }

  .input-box button {
    padding: 8px 12px;
    background: #25d366;
    border: none;
    color: white;
    cursor: pointer;
  }

  .tick::after {
    content: "✓";
    font-size: 12px;
    margin-left: 2px;
  }

  .tick-delivered::after {
    content: "✓✓";
  }

  .tick-read::after {
    content: "✓✓";
    color: #34b7f1;
  }

  .msg img.chat-image {
    max-width: 220px;
    max-height: 220px;
    width: auto;
    height: auto;
    border-radius: 8px;
    cursor: pointer;
    display: block;
  }

  .msg video.chat-video {
    max-width: 240px;
    max-height: 180px;
    border-radius: 8px;
    background: black;
    display: block;
  }

  .msg audio {
    max-width: 240px;
    display: block;
  }

  .msg .doc-box {
    background: #fff;
    border: 1px solid #ddd;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
    max-width: 240px;
  }

  .msg .doc-box a {
    text-decoration: none;
    color: #075e54;
    font-weight: bold;
  }
</style>
<div class="chat-header">
  {{ conversation.donor.phone_number }}
</div>

<div id="chat-container"
     data-conversation-id="{{ conversation.id }}"
     style="position: relative;">



  <!-- MESSAGES -->
  <div class="messages" id="messages">
    {% include "chat/partials/messages.html" %}
  </div>

  <!-- EMOJI PICKER (TEXT INPUT) -->
  <div id="emoji-picker"
       style="
         display:none;
         position:absolute;
         bottom:70px;
         left:10px;
         background:white;
         border:1px solid #ccc;
         padding:10px;
         border-radius:8px;
         z-index:1000;
         max-width:300px;
         box-shadow:0 4px 10px rgba(0,0,0,.15);
       ">
  </div>

</div>



<!-- TEXT MESSAGE FORM -->
<form class="input-box" hx-post="{% url 'send-message' conversation.id %}" hx-swap="none"
  hx-on="htmx:beforeRequest:this.reset()" style="position:relative;">

  {% csrf_token %}

  <button type="button" onclick="toggleEmojiPicker()"
    style="font-size:20px;background:none;border:none;cursor:pointer;">
    😊
  </button>
  <button type="button" id="record-btn"
  style="font-size:20px;background:none;border:none;cursor:pointer;">
  🎙️
</button>

<button type="button" id="stop-btn" style="display:none;">
  ⏹️
</button>

<audio id="voice-preview" controls style="display:none; max-width:200px;"></audio>


  <input type="text" id="text-input" name="text" placeholder="Type a message..." required style="flex:1;">

  <button type="submit">Send</button>
</form>




<!-- MEDIA MESSAGE FORM -->
<form class="input-box" hx-post="{% url 'send-media-message' conversation.id %}" hx-encoding="multipart/form-data"
  hx-swap="none" hx-on="htmx:afterRequest:this.reset()">

  {% csrf_token %}

  <input type="file" name="file" required>

  <select name="message_type" required>
    <option value="image">Image</option>
    <option value="document">Document</option>
    <option value="audio">Audio</option>
    <option value="video">Video</option>
  </select>

  <button type="submit">Send Media</button>
</form>


<script>
  window.EMOJIS = window.EMOJIS || [
  "😀","😁","😂","🤣","😊","😍","😘","😎","🤔","😢",
  "😭","😡","👍","👎","🙏","👏","🔥","❤️","🎉","👌",
  "🙌","🤝","🥳","😴","🤯"
];

  function toggleEmojiPicker() {
    const picker = document.getElementById("emoji-picker");
    const input = document.getElementById("text-input");
    if (!picker || !input) return;

    // Populate ONCE
    if (!picker.dataset.ready) {
      picker.innerHTML = "";
      EMOJIS.forEach(e => {
        const span = document.createElement("span");
        span.textContent = e;
        span.style.fontSize = "22px";
        span.style.cursor = "pointer";
        span.style.margin = "6px";

        span.onclick = () => {
          input.value += e;
          input.focus();
        };

        picker.appendChild(span);
      });
      picker.dataset.ready = "1";
    }

    picker.style.display =
      picker.style.display === "block" ? "none" : "block";
  }
</script>

<script>
(function () {
  // 🔒 Prevent HTMX re-execution
  if (window.__voiceRecorderInit) return;
  window.__voiceRecorderInit = true;

  window.mediaRecorder = null;
  window.audioChunks = [];
  window.isSending = false;

  const recordBtn = document.getElementById("record-btn");
  const stopBtn   = document.getElementById("stop-btn");

  if (!recordBtn || !stopBtn) return;

  recordBtn.onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    window.audioChunks = [];
    window.isSending = false;

    window.mediaRecorder = new MediaRecorder(stream, {
      mimeType: "audio/webm;codecs=opus"
    });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) {
        window.audioChunks.push(e.data);
      }
    };

    mediaRecorder.onstop = () => {
      if (window.isSending) return;
      window.isSending = true;

      const blob = new Blob(window.audioChunks, {
        type: "audio/webm"
      });

      sendRecordedAudio(blob);

      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    recordBtn.style.display = "none";
    stopBtn.style.display = "inline";
  };

  stopBtn.onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    recordBtn.style.display = "inline";
    stopBtn.style.display = "none";
  };

  window.sendRecordedAudio = function (blob) {
    const formData = new FormData();
    formData.append("file", blob, "voice.webm");
    formData.append("message_type", "audio");

    fetch("{% url 'send-media-message' conversation.id %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": document.querySelector(
          "[name=csrfmiddlewaretoken]"
        ).value
      },
      body: formData
    }).catch(err => {
      console.error("Voice send failed", err);
    });
  };
})();
</script>
