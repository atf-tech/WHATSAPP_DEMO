{% extends "chat/base.html" %}
{% block content %}

<style>
  .container {
    display: flex;
    height: calc(100vh - 50px);
  }

  .sidebar {
    width: 30%;
    background: white;
    border-right: 1px solid #ddd;
    overflow-y: auto;
  }

  .chat-area {
    width: 70%;
    background: #e5ddd5;
  }

  .chat-item {
    padding: 12px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }

  .chat-item:hover {
    background: #f5f5f5;
  }

  .chat-item.active {
    background: #e9edef;
  }

  .phone {
    font-weight: bold;
  }

  .preview {
    font-size: 13px;
    color: #555;
  }
</style>

<div class="container">

  <!-- LEFT: INBOX -->
  <div class="sidebar" id="inbox-list">
    {% for convo in conversations %}
      <div class="chat-item"
           hx-get="{% url 'conversation' convo.id %}"
           hx-target="#chat-box"
           hx-swap="innerHTML"
           hx-on="click:
              document.querySelectorAll('.chat-item')
                .forEach(i => i.classList.remove('active'));
              this.classList.add('active');">

        <div class="phone">{{ convo.donor.phone_number }}</div>

        <div class="preview">
          {{ convo.last_message_preview|default:"No messages yet" }}
        </div>

      </div>
    {% empty %}
      <p style="padding:15px;">No conversations</p>
    {% endfor %}
  </div>

  <!-- RIGHT: CHAT -->
  <div class="chat-area" id="chat-box">
    <p style="padding:20px;">Select a conversation</p>
  </div>

</div>

<script>
(function () {
  // 🔒 Prevent script from running multiple times
  if (window.__chatWsInitialized) return;
  window.__chatWsInitialized = true;

  let socket = null;
  let activeConversationId = null;

  function connect(conversationId) {
    if (!conversationId) return;

    if (socket) {
      socket.close();
      socket = null;
    }

    activeConversationId = conversationId;

    const protocol = location.protocol === "https:" ? "wss://" : "ws://";
    const wsUrl = protocol + window.location.host + "/ws/chat/" + conversationId + "/";

    socket = new WebSocket(wsUrl);

    socket.onmessage = function (e) {
  const data = JSON.parse(e.data);

  // ======================================
  // 1️⃣ TICK STATUS UPDATE
  // ======================================
  if (data.type === "message_status") {
    const tickEl = document.querySelector(
      `[data-message-id="${data.message_id}"] .tick`
    );
    if (!tickEl) return;
    tickEl.className = "tick tick-" + data.status;
    return;
  }

  // ======================================
  // 2️⃣ NORMAL / MEDIA MESSAGE
  // ======================================
  if (!data.message_type || !data.direction) return;

  const messagesBox = document.getElementById("messages");
  if (!messagesBox) return;

  const msg = document.createElement("div");
  msg.classList.add("msg", data.direction);
  msg.dataset.messageId = data.id;

  // ==========================
  // 3️⃣ BODY (TEXT / MEDIA)
  // ==========================
  if (data.message_type === "text") {
    const body = document.createElement("div");
    body.textContent = data.body;
    msg.appendChild(body);
  }

  if (data.message_type === "image") {
  const link = document.createElement("a");
  link.href = data.file_url;
  link.target = "_blank";

  const img = document.createElement("img");
  img.src = data.file_url;
  img.className = "chat-image";

  link.appendChild(img);
  msg.appendChild(link);
}


  if (data.message_type === "audio") {
  const audio = document.createElement("audio");
  audio.src = data.file_url;
  audio.controls = true;
  msg.appendChild(audio);
}


  if (data.message_type === "video") {
  const video = document.createElement("video");
  video.src = data.file_url;
  video.controls = true;
  video.className = "chat-video";
  msg.appendChild(video);
}


  if (data.message_type === "document") {
  const box = document.createElement("div");
  box.className = "doc-box";

  const link = document.createElement("a");
  link.href = data.file_url;
  link.target = "_blank";
  link.textContent = "📄 Download document";

  box.appendChild(link);
  msg.appendChild(box);
}


  // ==========================
  // 4️⃣ META (TIME + TICK)
  // ==========================
  const meta = document.createElement("div");
  meta.style.fontSize = "11px";
  meta.style.color = "#666";
  meta.style.textAlign = "right";

  const time = document.createElement("span");
  time.textContent = data.time;
  meta.appendChild(time);

  if (data.direction === "out") {
    const tick = document.createElement("span");
    tick.className = "tick tick-" + data.status;
    meta.appendChild(tick);
  }

  msg.appendChild(meta);
  messagesBox.appendChild(msg);
  messagesBox.scrollTop = messagesBox.scrollHeight;
};


  }

  document.body.addEventListener("htmx:afterSwap", function (e) {
  if (!e.target || e.target.id !== "chat-box") return;

  const container = e.target.querySelector("#chat-container");
  if (!container) return;

  const conversationId = container.dataset.conversationId;

  const messagesBox = container.querySelector("#messages");
  if (messagesBox) {
    setTimeout(() => {
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }, 50);
  }

  if (conversationId && conversationId !== activeConversationId) {
    connect(conversationId);
  }
});

})();
</script>

{% endblock %}
